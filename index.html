    <!-- タイトル画面の題名に使うドット風の書体（読み込めないときは既定のゴシック体） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" />
    <style>
      /* ブラウザ既定の body の余白（8px）を消し、白い枠と二重のスクロールバーを防ぐ */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #2f4f8f;
        /* 画面全体の書体（16ドット）。タイトルと同じ書体にそろえる。日本語が読めない環境では、標準の書体に戻す */
        font-family: 'DotGothic16', sans-serif;
        /* スマホ: 引っ張っての再読み込み・ダブルタップ拡大・長押しの文字選択と呼び出しメニューを止める */
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* スマホのブラウザは、100vh がアドレスバーの裏まで含む。ツールバーが隠れないよう、見えている範囲に固定する */
      #root {
        position: fixed;
        inset: 0;
        height: 100%;
      }
      @supports (height: 100dvh) {
        #root {
          height: 100dvh;
        }
      }
      /* 入力欄では文字の選択を許す */
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      /* UI の画像（アイコン・スプライト）は選択も、ブラウザのドラッグ（画像のドラッグ）もさせない */
      img {
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
