    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" />
    <style>
      /* ブラウザ既定の body の余白（8px）を消し、白い枠と二重のスクロールバーを防ぐ */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #2f4f8f;
      }
      #root {
        height: 100%;
      }
      /* UI の画像（アイコン・スプライト）は選択も、ブラウザのドラッグ（画像のドラッグ）もさせない */
      img {
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
      }
    </style>

    <div id="root"></div>
