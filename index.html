    <!-- タイトル画面の題名に使うドット風の書体（読み込めないときは既定のゴシック体） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" />
    <style>
      /* ブラウザ既定の body の余白（8px）を消し、白い枠と二重のスクロールバーを防ぐ */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #2f4f8f;
        /* 画面全体の書体（16ドット）。タイトルと同じ書体にそろえる。日本語が読めない環境では、標準の書体に戻す */
        font-family: 'DotGothic16', sans-serif;
        /* スマホ: 引っ張っての再読み込み・ダブルタップ拡大・長押しの文字選択と呼び出しメニューを止める */
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* スマホのブラウザは、100vh がアドレスバーの裏まで含む。ツールバーが隠れないよう、見えている範囲に固定する */
      #root {
        position: fixed;
        inset: 0;
        height: 100%;
      }
      @supports (height: 100dvh) {
        #root {
          height: 100dvh;
        }
      }
      /* ノッチ・角丸の画面（iPhone など）では、画面の端に安全な余白を取り、時計やノッチの下に UI を置かない（viewport-fit=cover と組み合わせる） */
      #root {
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      /* 入力欄では文字の選択を許す */
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      /* スクロールバーは、ゲームの部品と同じドット絵（細い溝と、角のつまみ）。Firefox は scrollbar-color、Chromium と Safari は ::-webkit-scrollbar */
      * {
        scrollbar-width: thin;
        scrollbar-color: #7f9cc9 #1d3664;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #1d3664;
        border-left: 2px solid #3b2a33;
      }
      ::-webkit-scrollbar-thumb {
        background: #7f9cc9;
        border: 2px solid #1d3664;
        border-radius: 0;
      }
      /* スマホ（指で触る画面）は、スクロールバーを出さない（指で動かす）。端で切れていることは、一覧の上下の影で示す */
      @media (pointer: coarse) {
        * {
          scrollbar-width: none;
        }
        ::-webkit-scrollbar {
          width: 0;
          height: 0;
        }
      }
      /* 一覧の上下の影: 端までスクロールしていないときだけ見える影（local の背景を使う） */
      .scroll-edge {
        background:
          linear-gradient(#25406f 30%, rgba(37, 64, 111, 0)) top / 100% 24px no-repeat local,
          linear-gradient(rgba(37, 64, 111, 0), #25406f 70%) bottom / 100% 24px no-repeat local,
          linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0)) top / 100% 8px no-repeat scroll,
          linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.45)) bottom / 100% 8px no-repeat scroll;
      }
      /* UI の画像（アイコン・スプライト）は選択も、ブラウザのドラッグ（画像のドラッグ）もさせない */
      img {
        user-select: none;
        -webkit-user-select: none;
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
