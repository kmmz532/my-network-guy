name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 生成と型の検査（npm run build は生成物を作ってから tsc を行う）
        run: npm run build
      - name: 単体テスト
        run: npx vitest run
